name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel

      - name: Build distribution
        run: |
          python -m build

      - name: Check distribution
        run: |
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          verbose: true
          print-hash: true
          attestations: true

      - name: Publish to GitHub Packages
        run: |
          mkdir -p ~/.pypirc
          echo "[distutils]" > ~/.pypirc
          echo "index-servers = github" >> ~/.pypirc
          echo "[github]" >> ~/.pypirc
          echo "repository: https://github.com/pyfortg/pyfortg/packages" >> ~/.pypirc
          echo "username: ${{ github.actor }}" >> ~/.pypirc
          echo "password: ${{ secrets.GITHUB_TOKEN }}" >> ~/.pypirc
          twine upload --repository github dist/* --skip-existing || true

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: PyForTG ${{ github.ref }}
          body: |
            # PyForTG Release

            Version: ${{ github.ref }}

            See [CHANGELOG.md](../../CHANGELOG.md) for details.

            ## Installation

            ```bash
            pip install pyfortg
            ```
          draft: false
          prerelease: false
