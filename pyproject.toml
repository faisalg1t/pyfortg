[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfortg"
version = "1.0.0"
description = "Production-ready Python package for building high-concurrency Telegram bots with webhooks, async-first architecture, and built-in Redis/PostgreSQL support"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PyForTG Contributors", email = "support@pyfortg.dev"}
]
keywords = ["telegram", "bot", "api", "async", "webhook", "redis", "postgresql"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]

dependencies = [
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
redis = ["aioredis>=2.0.0"]
postgres = ["asyncpg>=0.27.0"]
full = ["aioredis>=2.0.0", "asyncpg>=0.27.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.11.0",
    "flake8>=4.0.0",
    "mypy>=0.991",
    "mkdocs>=1.4.0",
    "mkdocs-material>=8.5.0",
]

[project.urls]
Homepage = "https://github.com/pyfortg/pyfortg"
Repository = "https://github.com/pyfortg/pyfortg.git"
Documentation = "https://pyfortg.dev"
Issues = "https://github.com/pyfortg/pyfortg/issues"

[tool.setuptools]
packages = ["pyfortg"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=pyfortg --cov-report=term-missing:skip-covered"
